plugins {
    id "io.github.qishr.cascara-meta.java-library" version "0.1.0"
    id "io.github.qishr.cascara-meta.publish" version "0.1.0"
}


repositories {
	mavenLocal()
	mavenCentral()
}


dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // Cascara
    implementation "io.github.qishr:cascara-common"
    // implementation "io.github.qishr:cascara-common-io"

    // Log4j
    implementation "org.apache.logging.log4j:log4j-api:2.25.5"
    implementation 'org.apache.logging.log4j:log4j-core:2.25.5'

}


tasks.withType(JavaCompile).configureEach {
    options.release = 21
}


// application {
//     mainClass.set("io.github.qishr.cascara.logging.log4j.Main")
//     mainModule.set("cascara.logging.log4j")
// }


tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}


